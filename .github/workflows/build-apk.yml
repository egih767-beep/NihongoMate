
name: Build NihongoMate APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak proyek
        run: |
          unzip -o NihongoMate_Android_Starter.zip -d .
          test -f NihongoMate/settings.gradle.kts

      
      - name: Periksa konfigurasi Java dan Kotlin
        run: |
          echo "=== File Gradle ==="
          find NihongoMate -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print

          echo "=== Konfigurasi JVM ==="
          grep -RniE 'VERSION_1_8|VERSION_17|jvmTarget|sourceCompatibility|targetCompatibility|kotlinOptions|compilerOptions' NihongoMate --include='*.gradle' --include='*.gradle.kts' || true

            
      - name: Build APK
        run: gradle -p NihongoMate assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: NihongoMate-debug-APK
          path: NihongoMate/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
