
name: Build NihongoMate APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak proyek
        run: |
          unzip -o NihongoMate_Android_Starter.zip -d .
          test -f NihongoMate/settings.gradle.kts

      - name: Build APK
        run: gradle -p NihongoMate assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: NihongoMate-debug-APK
          path: NihongoMate/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
