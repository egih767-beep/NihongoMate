
name: Build NihongoMate APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Ekstrak proyek v2
        run: |
          unzip -o NihongoMate_Starter_v2.zip -d .
          test -f NihongoMate/settings.gradle.kts
          


      - name: Periksa konfigurasi proyek
        run: |
          echo "=== Struktur file Gradle ==="
          find NihongoMate -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.properties' \) -print

          echo "=== Isi app/build.gradle.kts ==="
          if [ -f NihongoMate/app/build.gradle.kts ]; then
            cat NihongoMate/app/build.gradle.kts
          fi

          echo "=== Isi app/build.gradle ==="
          if [ -f NihongoMate/app/build.gradle ]; then
            cat NihongoMate/app/build.gradle
          fi

          echo "=== Konfigurasi properti Gradle ==="
          find NihongoMate -name 'gradle.properties' -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
          


      - name: Atur target Java dan Kotlin ke 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("NihongoMate/app/build.gradle.kts")
          s = p.read_text()

          old = '    buildFeatures { compose = true }'
          new = '''    compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures { compose = true }'''

          if old not in s:
              raise SystemExit("Baris buildFeatures tidak ditemukan; file tidak diubah.")

          p.write_text(s.replace(old, new, 1))
          print(p.read_text())
          PY

      - name: Build APK
        run: gradle -p NihongoMate assembleDebug
        

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: NihongoMate-debug-APK
          path: NihongoMate/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
