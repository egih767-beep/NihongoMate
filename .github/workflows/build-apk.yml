
name: Build NihongoMate APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak proyek
        run: |
          unzip -o NihongoMate_Android_Starter.zip -d .
          test -f NihongoMate/settings.gradle.kts

      - name: Periksa konfigurasi Java
        run: |
          echo "=== Konfigurasi Java dan Kotlin ==="
          grep -RniE 'VERSION_1_8|VERSION_8|jvmTarget|sourceCompatibility|targetCompatibility|jvmToolchain' NihongoMate --include='*.gradle' --include='*.gradle.kts' || true

      - name: Paksa target Java dan Kotlin ke 17
        run: |
          cat > "$GITHUB_WORKSPACE/force-jvm.gradle" <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }

              tasks.configureEach { task ->
                  if (task.name.toLowerCase().contains('kotlin') &&
                      task.hasProperty('kotlinOptions')) {
                      task.kotlinOptions.jvmTarget = '17'
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle -I "$GITHUB_WORKSPACE/force-jvm.gradle" -p NihongoMate assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: NihongoMate-debug-APK
          path: NihongoMate/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
