
name: Build NihongoMate APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak dan deteksi proyek
        run: |
          unzip -o NihongoMate_v10_Source.zip -d .
          if [ -f NihongoMate/settings.gradle.kts ]; then
            echo "PROJECT_DIR=NihongoMate" >> "$GITHUB_ENV"
          elif [ -f NihongoMate_old/settings.gradle.kts ]; then
            echo "PROJECT_DIR=NihongoMate_old" >> "$GITHUB_ENV"
          else
            echo "File settings.gradle.kts tidak ditemukan"
            find . -name settings.gradle.kts -print
            exit 1
          fi

      - name: Periksa konfigurasi proyek
        run: |
          echo "Proyek: $PROJECT_DIR"
          find "$PROJECT_DIR" -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.properties' \) -print
          cat "$PROJECT_DIR/app/build.gradle.kts"

      - name: Atur target Java dan Kotlin ke 17
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          p = project / "app/build.gradle.kts"
          s = p.read_text()

          if 'jvmTarget = "17"' not in s:
              old = '    buildFeatures { compose = true }'
              if old not in s:
                  raise SystemExit("Pola buildFeatures tidak ditemukan; perlu cek file Gradle.")
              new = '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures { compose = true }'''
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: NihongoMate-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
          
